<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket Proxy</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 40px;
        line-height: 1.5;
      }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .card {
        max-width: 860px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 18px 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ticket Proxy</h1>
      <p>
        This service exposes:
        <code>POST /tickets</code>,
        <code>GET /health</code>,
        <code>GET /diag</code>
        (optionally under <code>APPLICATION_PREFIX</code>).
      </p>
      <p>
        If you're deploying behind IIS, set <code>AUTH_TOKEN</code> and
        <code>UPSTREAM_URL</code> in <code>web.config</code>.
      </p>
    </div>
  </body>
</html>
